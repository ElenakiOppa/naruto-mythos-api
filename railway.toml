[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'test -n \"$DATABASE_URL\" || { echo \"DATABASE_URL is required\" >&2; exit 1; }; exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers'"
preDeployCommand = "alembic upgrade head"
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
