name: Phase 15 real database validation

on:
  workflow_dispatch:
  push:
    branches:
      - phase15-real-db-validation

jobs:
  disposable-import-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Acquire approved first-party snapshot into runner temp storage
        run: >-
          python -m scripts.acquisition.run_acquisition
          --root "$RUNNER_TEMP/naruto-mythos-acquisition"
      - name: Upgrade disposable database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
        run: python -m alembic upgrade head
      - name: Run Phase 15 acquisition, import, idempotency and API validation
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
          CORS_ORIGINS: ""
          RAPIDAPI_PROXY_SECRET: ""
        run: >-
          python scripts/phase15_ci_validation.py
          --root "$RUNNER_TEMP/naruto-mythos-acquisition"
